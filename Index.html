<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pronombres · Español A2</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#203047;font:18px system-ui,sans-serif}main{max-width:960px;margin:32px auto;padding:24px}header{margin-bottom:24px}h1{font-size:clamp(28px,5vw,44px);margin:8px 0}p{line-height:1.5}small{color:#53647a}.panel{background:white;border:1px solid #dce3ed;border-radius:20px;padding:clamp(16px,4vw,36px);box-shadow:0 8px 30px #2030470a}.steps{display:flex;gap:8px;margin-bottom:28px}.steps span{flex:1;border-top:5px solid #dce3ed;padding-top:8px;font-size:14px}.steps .on{border-color:#2457b8;font-weight:700}.line{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center;min-height:88px;margin:18px 0}.tile{font:700 clamp(18px,3vw,28px) system-ui;border:2px solid;border-radius:12px;padding:17px 23px;position:relative;display:inline-flex;align-items:center;justify-content:center;min-height:70px;user-select:none}.s{background:#dbeafe;color:#17438a;border-color:#93baf4}.v{background:#dcfce7;color:#166534;border-color:#86d7a3}.o,.p{background:#ffedd5;color:#9a3412;border-color:#f5b87b}.p{background:#fed7aa;border-color:#ed8738}button{cursor:pointer;font:600 16px system-ui}button:focus-visible{outline:3px solid #2457b8;outline-offset:4px}.slot{min-width:110px;min-height:74px;border:2px dashed #aab8ca;border-radius:12px;display:flex;justify-content:center;align-items:center;color:#65758b}.slot.over,.target.over{outline:4px solid #2457b8}.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:20px}.btn{padding:12px 20px;border:1px solid #b6c2d3;border-radius:9px;background:white;color:#203047}.primary{background:#2457b8;color:white;border-color:#2457b8}.feedback{min-height:30px;text-align:center;color:#ad2727;font-weight:600}.ok{color:#166534}.cover{position:absolute;inset:-2px;background:#fed7aa;border:2px solid #ed8738;border-radius:12px;display:flex;align-items:center;justify-content:center;animation:cover .5s ease both}@keyframes cover{from{transform:translateY(35px);opacity:0}to{transform:translateY(0);opacity:1}}.legend{display:flex;gap:20px;flex-wrap:wrap;font-size:14px;margin-top:24px}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px}.rule{margin-top:22px;background:white;border:1px solid #dce3ed;padding:18px;border-radius:14px}summary{cursor:pointer;font-weight:700}table{width:100%;border-collapse:collapse;margin-top:15px}td,th{padding:12px;text-align:left;border-bottom:1px solid #dce3ed}.center{text-align:center}.muted{color:#53647a;font-size:15px}.move{animation:move .65s ease both}@keyframes move{from{transform:translateX(70px);opacity:.3}to{transform:translateX(0);opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}@media(max-width:500px){main{margin:0;padding:12px}.tile{padding:12px;min-height:58px}.slot{min-width:80px;min-height:62px}.line{gap:7px}.steps span{font-size:12px}}
.crossed{position:relative}.crossed:after,.crossed:before{content:"";position:absolute;left:5%;top:50%;width:90%;height:6px;background:#dc2626;border-radius:6px;transform:rotate(20deg) scaleX(0);animation:cross1 .55s .25s forwards}.crossed:after{transform:rotate(-20deg) scaleX(0);animation:cross2 .55s .8s forwards}@keyframes cross1{to{transform:rotate(20deg) scaleX(1)}}@keyframes cross2{to{transform:rotate(-20deg) scaleX(1)}}.reveal{animation:reveal .4s 1.4s both}@keyframes reveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.crossed:before{transform:rotate(20deg) scaleX(1)}.crossed:after{transform:rotate(-20deg) scaleX(1)}}
.position-line{flex-wrap:nowrap;gap:8px}.position-line .pos{min-width:62px;min-height:74px;background:#fff;padding:4px;flex:0 1 100px}.position-line .pos.chosen{border-color:#ed8738;background:#fff7ed}.position-line .pos .tile{min-height:52px;padding:8px 12px}.position-line>.tile{padding:14px 18px}@media(max-width:600px){.position-line{gap:4px}.position-line .pos{min-width:38px;min-height:60px}.position-line>.tile{padding:9px 8px;font-size:clamp(14px,3.5vw,21px)}.position-line .pos .tile{padding:5px;min-height:40px;font-size:17px}}.rule[hidden]{display:none}.neutral{background:#f1f5f9;color:#203047;border-color:#b6c2d3}.practice-tag{font-size:14px;color:#2457b8;font-weight:700;letter-spacing:.04em}.practice-source{font-size:clamp(20px,4vw,30px);text-align:center;background:#f4f7fb;padding:18px;border-radius:12px}.practice-source mark{background:#ffedd5;color:#9a3412;border-radius:4px;padding:2px 5px}.practice-progress{height:7px;background:#dce3ed;border-radius:8px;overflow:hidden;margin:15px 0 25px}.practice-progress i{display:block;background:#2457b8;height:100%}
nav{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 24px}nav button{flex:1;min-width:120px}.active{background:#2457b8;color:white}.io{background:#ede9fe;color:#5b21b6;border-color:#a78bfa}.neutral{background:#f8fafc;color:#203047;border-color:#aab8ca}.cross:after,.cross:before{content:'';position:absolute;width:90%;height:5px;background:#dc2626;left:5%;top:50%;border-radius:4px;animation:draw .6s both;transform:rotate(17deg)}.cross:after{transform:rotate(-17deg);animation-delay:.35s}@keyframes draw{from{scale:0 1}to{scale:1 1}}.cross{opacity:.85}.slot{padding:8px;min-width:90px}.slot .tile{padding:10px 14px;min-height:48px}.cover.io{background:#ddd6fe;border-color:#8b5cf6;color:#5b21b6}.center{text-align:center}.muted{color:#53647a}.tile:disabled{opacity:.3;cursor:default}.hint{border-left:4px solid #2457b8;padding:10px 16px;background:#eff6ff}.chosen{border-color:#2457b8}.sectionlabel{font-size:14px;color:#53647a;font-weight:700;text-transform:uppercase;letter-spacing:.08em}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(max-width:600px){main{margin:0;padding:12px}.tile{padding:10px 12px;min-height:50px}.line{gap:7px}.slot{min-width:60px;min-height:50px}}
</style></head><body><main><header><small>ESPAÑOL A2 · GRAMÁTICA INTERACTIVA</small><h1>¡Sustituye los objetos!</h1><p>Descubre, elige y ordena los pronombres.</p></header><nav id="nav" aria-label="Acceso directo"></nav><section class="panel" id="app"></section></main><script>
const D=[['María','compra','un libro','lo'],['Pedro','come','una manzana','la'],['Ana','busca','los zapatos','los'],['Pablo','compra','las entradas','las'],['Lucía','prepara','la cena','la'],['Carlos','lee','los periódicos','los'],['Sofía','necesita','un lápiz','lo'],['Elena','lava','las camisetas','las']];
const I=[['Ana','da','un libro','lo','a Pablo','le'],['Luis','envía','una carta','la','a sus padres','les'],['Clara','regala','los juguetes','los','a su hermano','le'],['Marta','manda','las fotos','las','a sus amigas','les'],['Diego','presta','el coche','lo','a Julia','le'],['Eva','escribe','una nota','la','a sus vecinos','les'],['Pablo','vende','los billetes','los','a Carlos','le'],['Sara','entrega','las llaves','las','a sus clientes','les']];
const all=['lo','la','los','las','le','les','se'], names=['Objeto directo','Objeto indirecto','Los dos pronombres'];let block=0,practice=false,n=0,step=0,selected=[],msg='',ok=false,choices=[],pool=[];
const app=document.querySelector('#app'),nav=document.querySelector('#nav');
const e=()=> (block===0?D:I)[n+(practice?4:0)];
const original=()=>block===0?e().slice(0,3):[...e().slice(0,3),e()[4]];
const answer=()=>block===0?[e()[0],e()[3],e()[1]]:block===1?[e()[0],e()[5],e()[1],e()[2]]:[e()[0],'se',e()[3],e()[1]];
const alternatives=()=>block===0?[e()[3]]:block===1?[e()[5]]:[e()[5],e()[3]];
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function reset(){step=0;selected=[];choices=[];msg='';ok=false;pool=shuffle(practice?[e()[0],e()[1],...(block===1?[e()[2]]:[]),...all]:original());render()}
function go(b,p){block=b;practice=p;n=0;reset()}
function btn(t,a,primary=false){return `<button class="btn ${primary?'primary':''}" data-act="${a}">${t}</button>`}
function tile(t,c='neutral',a='',drag=''){return a?`<button class="tile ${c}" data-act="${a}" ${drag?`draggable="true" data-drag="${drag}"`:''}>${t}</button>`:`<span class="tile ${c}">${t}</span>`}
function sentence(cross=false,cover=false){return `<div class="line">${original().map((w,i)=>{let target=(block!==1&&i===2)||(block!==0&&i===3),c=['s','v','o','io'][i];let p=i===2?e()[3]:e()[5];return `<span class="tile ${c} ${cross&&target?'cross':''}">${w}${cover&&target?`<span class="cover ${i===3?'io':''}">${p}</span>`:''}</span>`}).join('')}</div>`}
function build(){let len=practice||step===4?answer().length:original().length;return `<div class="line">${pool.map((w,i)=>selected.includes(i)?`<button class="tile neutral" disabled>${w}</button>`:tile(w,'neutral','add:'+i,'word:'+i)).join('')}</div><div class="center muted">↓</div><div class="line">${Array.from({length:len},(_,i)=>`<button class="slot" data-act="remove:${i}" data-drop="${i}" aria-label="Espacio ${i+1}">${selected[i]!=null?`<span class="tile neutral">${pool[selected[i]]}</span>`:i+1}</button>`).join('')}</div><div class="actions">${btn('Comprobar','check',true)}</div>`}
function render(){nav.innerHTML=names.map((name,i)=>`<div style="flex:1;min-width:155px;display:grid;gap:6px"><button class="btn ${block===i&&!practice?'active':''}" data-go="${i}:0">${name}</button><button class="btn ${block===i&&practice?'active':''}" data-go="${i}:1">Práctica ${i+1}</button></div>`).join('');let h=`<div class="sectionlabel">${names[block]} · ${practice?'Práctica':'Descubre la regla'} · ${n+1} de 4</div>`;
if(practice){h+=`<h2>Elige y ordena las tarjetas</h2><p class="center" style="font-size:25px;font-weight:700">${original().join(' ')}.</p><p>Sustituye ${['solo el objeto directo','solo el objeto indirecto','los dos objetos'][block]}. Usa las tarjetas necesarias; algunas sobran.</p>`;if(step===5)h+=result();else h+=build()}
else if(step===0)h+=`<h2>Ordena la frase original</h2><p>Pulsa o arrastra las tarjetas.</p>${build()}`;
else if(step===1)h+=`<h2>¡No necesitamos repetir ${block===2?'los objetos':'el objeto'}!</h2>${sentence(true)}<p class="center">Ya sabemos de qué hablamos. Podemos usar ${block===2?'dos pronombres':'un pronombre'}.</p><div class="actions">${btn('¿Qué pronombre usamos?','choose',true)}</div>`;
else if(step===2){let j=choices.length, target=block===0?e()[2]:block===1?e()[4]:j===0?e()[4]:e()[2];h+=`<h2>¿Qué pronombre sustituye a «${target}»?</h2>${sentence(true)}<div class="line">${(block===0?all.slice(0,4):block===1?all.slice(4,6):all).map(p=>tile(p,'neutral','pick:'+p)).join('')}</div>${choices.length?`<p class="center">Ya has elegido: ${choices.join(' + ')}</p>`:''}`}
else if(step===3){h+=`<h2>¡Tenemos ${block===2?'dos sustitutos':'un sustituto'}!</h2>${sentence(false,true)}`;if(block===2)h+=`<p class="center">${e()[5]} + ${e()[3]} no se combinan así. ¿Con qué pronombre cambiamos «${e()[5]}»?</p><div class="line">${all.map(p=>tile(p,'neutral','combine:'+p)).join('')}</div>`;else h+=`<div class="actions">${btn('¿Dónde lo colocamos?','position',true)}</div>`}
else if(step===4){h+=`<h2>¿Dónde colocamos ${block===2?'los pronombres':'el pronombre'}?</h2><p>Elige las tarjetas y construye la frase. Descubre el orden correcto.</p>${build()}`}
else h+=result();
 h+=`<div class="feedback ${ok?'ok':''}" role="status">${msg}</div><div class="actions">${btn('Reiniciar ejercicio','reset')}${btn('Ir a la práctica de este bloque','practice')}</div>`;app.innerHTML=h}
function result(){let rule=block===0?'Lo, la, los y las sustituyen al objeto directo. Concuerdan en género y número.':block===1?'Le sustituye a una persona; les, a varias (en estos ejemplos). El objeto directo se conserva.':`Le / les + lo, la, los o las → se + lo, la, los o las. Primero va el indirecto y luego el directo.`;return `<h2 class="ok">¡Correcto!</h2><div class="line">${answer().map((w,i)=>tile(w,i===0?'s':w===e()[1]?'v':w==='se'||w===e()[5]?'io':'o')).join('')}</div><p class="hint">${rule} En estas frases, los pronombres van delante del verbo conjugado.</p><div class="actions">${btn(n<3?'Siguiente →':practice?(block<2?'Siguiente bloque →':'Volver al inicio'):'Empezar la práctica →','next',true)}</div>`}
function act(a){msg='';ok=false;let [k,v]=a.split(':');if(k==='add'){let len=practice||step===4?answer().length:original().length;let i=Array.from({length:len},(_,i)=>i).find(i=>selected[i]==null);if(i!=null&&!selected.includes(+v))selected[i]=+v}else if(k==='remove')selected[+v]=null;else if(k==='check'){let expected=practice||step===4?answer():original();if(expected.every((w,i)=>pool[selected[i]]===w)){step=practice||step===4?5:1;ok=true}else msg='Revisa las tarjetas y el orden. Inténtalo otra vez.'}else if(k==='choose')step=2;else if(k==='pick'){if(v===alternatives()[choices.length]){choices.push(v);if(choices.length===alternatives().length)step=3}else msg='Ese pronombre no corresponde al objeto. Prueba otra vez.'}else if(k==='combine'){if(v==='se'){startPosition();return}else msg='Prueba otra tarjeta.'}else if(k==='position'){startPosition();return}else if(k==='reset'){reset();return}else if(k==='practice'){go(block,true);return}else if(k==='next'){if(n<3){n++;reset()}else if(!practice)go(block,true);else go((block+1)%3,false);return}render()}
function startPosition(){step=4;selected=[];pool=shuffle(answer());render()}
nav.addEventListener('click',ev=>{let b=ev.target.closest('[data-go]');if(b){let [x,y]=b.dataset.go.split(':').map(Number);go(x,!!y)}});app.addEventListener('click',ev=>{let b=ev.target.closest('[data-act]');if(b)act(b.dataset.act)});app.addEventListener('dragstart',ev=>{let b=ev.target.closest('[data-drag]');if(b)ev.dataTransfer.setData('text/plain',b.dataset.drag)});app.addEventListener('dragover',ev=>{if(ev.target.closest('[data-drop]'))ev.preventDefault()});app.addEventListener('drop',ev=>{let b=ev.target.closest('[data-drop]');if(!b)return;ev.preventDefault();let d=ev.dataTransfer.getData('text/plain');if(!/^word:\d+$/.test(d))return;let i=+d.split(':')[1];if(i>=pool.length)return;let old=selected.indexOf(i);if(old>=0)selected[old]=null;selected[+b.dataset.drop]=i;msg='';render()});go(0,false);
</script></body></html>
